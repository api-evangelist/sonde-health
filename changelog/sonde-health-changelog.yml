- version: '2.6'
  date: '2021-04-07'
  breaking: false
  behaviour_change: true
  highlights:
  - >-
    Elicitation Check (ELCK) for Respiratory Symptom Risk voice samples — automatic
    validation of energy level, voice presence, and correct elicitation (a single
    continuous "ahh" held for 6 seconds). Failing samples are rejected.
  - >-
    New failure response on POST /platform/v1/inference/scores — HTTP 422 with error
    code ELICITATION_CHECK_FAILED. No additional API calls are required to opt in,
    so integrators saw a new rejection path without changing code.
  notes:
  - Sonde states Elicitation Check accuracy is approximately 80%.
  - Sonde recommends asking for no more than 3 voice samples before treating the test
    as unavailable.
- version: '2.5'
  date: '2021-02'
  breaking: false
  highlights:
  - Backward compatible with API 1.0, adding the API 2.0 and 2.5 resources
  additions:
  - QuestionnaireManager — return a questionnaire to show in the partner app and capture
    its responses
  - UserService — update device type and device manufacturer
  - InferenceService — historical score data for one or many subjects over a date/time
    range
  - StorageService — download submitted audio files
