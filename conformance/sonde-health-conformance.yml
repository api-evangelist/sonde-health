- id: hipaa
  conforms: claimed
  evidence: >-
    "Sonde's platform is HIPAA compliant" — Sonde API Platform Introduction. The docs
    also apply HIPAA operationally: "As per HIPAA audio file is considered as PII and
    hence the audio file should not leave the country of end-user", enforced by a
    required countryCode when requesting a signed storage URL, with a published list of
    supported PII/PHI storage regions.
  attestation_published: false
  note: >-
    Recorded as `claimed`, not `verified`. Sonde publishes the claim in prose; it does
    not publish a SOC 2 report, an HITRUST or ISO 27001 certificate, a trust center, or
    any third-party attestation. probe-security-programs.py found no trust center and no
    vulnerability-disclosure program.
  source: https://sondehealth.atlassian.net/wiki/spaces/SA/pages/2707062806/Sonde+API+Platform+Introduction
- id: fhir
