entities:
- name: Organization
  service: platform
  description: The partner tenant a credential belongs to. Screening results are scoped
    to it; cross-organization reads return FORBIDDEN_ACCESS.
  in_spec: implied
- name: Subject
  aliases: [user]
  service: UserService
  description: An end user registered with Sonde. Carries yearOfBirth, gender, device
    metadata (mandatory from POST /platform/v2/users) and an optional partner-supplied
    userIdentifier for mapping back to the partner's own records.
  in_spec: true
  spec_schema: user
- name: Token
  service: platform
  description: Names the session under which a screening/measure run was performed.
  in_spec: true
  spec_schema: token
- name: Measure
  service: MeasureService
  description: A named health check with versioned variants — mental-fitness (v1/v2/v3),
    respiratory symptoms risk (v1/V2), m3.
  in_spec: false
  lookup: GET /platform/v1/measures/name/{measureName}?variant={variant}
- name: AudioFile
  service: StorageService
  description: A WAV voice sample uploaded to a signed S3 URL. Country-scoped — the
    countryCode supplied at signed-URL request time pins the storage region.
  in_spec: false
- name: InferenceJob
  service: InferenceService
  description: Asynchronous job that turns one or two audio samples into a score.
    Created then polled.
  in_spec: false
- name: Score
  service: InferenceService
  description: The measure outcome. Respiratory Symptoms Risk returns a single 0-100
    value; Mental Fitness returns per-feature voice-feature scores plus an aggregate.
  in_spec: false
- name: VoiceFeatureScore
  service: InferenceService
  description: Per-acoustic-feature score — Smoothness, Control, Liveliness, Energy
    Range, Clarity, Crispness, Speech Rate, Pause Duration.
  in_spec: false
- name: TranscriptionJob
  service: TranscriptionService
  description: Asynchronous speech-to-text job over a stored audio file (English only).
  in_spec: false
- name: Questionnaire
  service: QuestionnaireManager
  description: A partner or Sonde-authored questionnaire (M3, PHQ-2) retrievable by id
    and language.
  in_spec: false
- name: QuestionnaireResponse
  service: QuestionnaireManager
  description: A subject's submitted answers, scoreable through the inference surface.
  in_spec: false
- name: ScreeningResult
  service: ScreeningReports
  description: A PASS/FAIL session outcome with its token, subject and calculation
    timestamp.
  in_spec: true
  spec_schema: screening_result
- name: ScreeningResultPage
  service: ScreeningReports
  description: Paged envelope over screening results with requestId, numberOfRecords
    and numberOfPages.
  in_spec: true
  spec_schema: screening_result_response
