- name: Sonde Screening API
  description: 'The Sonde Screening API (Sonde Product Partner API) exposes partner
    screening-session outcomes: an OAuth 2.0 client-credentials token endpoint and
    a paged, filterable screening-results report listing each session token, subject,
    PASS/FAIL outcome and calculation timestamp.'
  humanURL: https://sondehealth.atlassian.net/wiki/spaces/SPPA/pages/1614250108/REST+API+Reference
