aid: sonde-health
name: Sonde Health
description: 'Sonde Health is a Boston-based digital health company that turns short
  voice samples into vocal biomarkers — objective, AI-derived measures of respiratory,
  mental and cognitive fitness. Founded out of PureTech Health, Sonde has banked over
  1,000,000 voice samples from more than 80,000 subjects to train its Health Check
  models. Partners integrate through the Sonde Platform Service API (a HIPAA-aligned
  REST API on api.sondeservices.com secured with OAuth 2.0 client-credentials and
  fine-grained sonde-platform/* scopes), through on-device Passive, Cued and Edge SDKs
  for Android and iOS, and through OEM integrations such as Qualcomm''s Snapdragon
  Sound platform. The cloud flow is upload-and-score: register a subject, request a
  signed storage URL, upload a WAV sample, then create an inference job and poll for
  Respiratory Symptoms Risk, Mental Fitness voice-feature scores, M3/PHQ-2 questionnaire
  scores, or an English transcription.'
