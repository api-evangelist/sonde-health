apis:
- name: Sonde Platform Service API
  description: 'The Sonde Platform Service API lets partners run Sonde Vocal Biomarker
    Health Checks from their own mobile, web and embedded applications. Services cover
    user registration (UserService), signed-URL audio upload (StorageService), measure
    lookup (MeasureService), synchronous and asynchronous inference (InferenceService),
    speech-to-text (TranscriptionService) and questionnaire delivery/scoring (QuestionnaireManager).
    Authentication is OAuth 2.0 client-credentials against an Amazon Cognito user pool.'
  humanURL: https://sondehealth.atlassian.net/wiki/spaces/SA/pages/2707062806/Sonde+API+Platform+Introduction
