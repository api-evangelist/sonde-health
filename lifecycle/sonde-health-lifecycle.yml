    kind: operation
    replacement: POST /platform/v2/users
    announced_in: API Release Notes (April 5th release date)
    reason: >-
      "Sonde will release API 2.7 version (POST /platform/v2/users), where 'device'
      related metadata/attributes will be mandatory."
    sunset_date: not stated
    source: https://sondehealth.atlassian.net/wiki/spaces/SA/pages/2706866198/API+Release+Notes+and+Best+Practices
  - item: Respiratory Symptoms Risk (v1)
