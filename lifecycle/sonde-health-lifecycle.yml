contract_availability:
  published_spec_reachable: partial
  detail: >-
    Sonde's Platform Service API "REST API Reference" page carries a Confluence open-api
    macro whose url parameter points at
    https://sonde-partner-api.s3.ap-south-1.amazonaws.com/stage/api-platform-doc.yaml.
    That object returns HTTP 404 with S3 error code NoSuchBucket — the bucket Sonde
    served its own OpenAPI from has been deleted — so the reference page renders an empty
    spec viewer and the platform contract is effectively unpublished. The Screening API
    spec survived only because it is embedded INLINE in its macro body rather than
    linked; that document is captured verbatim in
    openapi/sonde-health-screening-api-openapi.yaml. Republishing the platform spec is
    the single highest-value fix available to Sonde.
  evidence:
  - url: https://sonde-partner-api.s3.ap-south-1.amazonaws.com/stage/api-platform-doc.yaml
    status: 404
    body: '<Error><Code>NoSuchBucket</Code>...<BucketName>sonde-partner-api</BucketName></Error>'
  - url: https://sondehealth.atlassian.net/wiki/spaces/SA/pages/2689105939/REST+API+Reference
    status: 200
  - url: https://sondehealth.atlassian.net/wiki/spaces/SPPA/pages/1614250108/REST+API+Reference
    status: 200
