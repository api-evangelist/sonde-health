versioning:
  policy_published: true
  style: path-segment (/platform/v1, /platform/v2, /platform/async/v1) plus a per-measure
    `variant` query parameter
  compatibility_contract:
    published: true
    url: https://sondehealth.atlassian.net/wiki/spaces/SA/pages/2688450588/API+upgrades
    backwards_compatible:
    - Adding new API resources
    - Adding new optional request parameters to existing API methods
    - Adding new properties to existing API responses
    - Changing the order of properties in existing API responses
    - Changing the length or format of opaque strings such as resource IDs and error
      messages, including adding or removing fixed prefixes
    id_length_guarantee: Resource IDs never exceed 40 characters.
deprecation:
  policy_published: true
  policy_style: prose notices on the affected documentation page and in the release notes
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Sonde announces deprecations in prose — a banner on the measure's documentation page
    and a note in the release notes — and does not emit RFC 8594 Sunset/Deprecation
    response headers. No notice period is stated for any of the deprecations below.
  deprecated:
